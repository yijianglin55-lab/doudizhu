<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大厅 - 斗地主</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .ws-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
    .ws-dot.on { background:#00b894; }
    .ws-dot.off { background:#e94560; }
    .ws-dot.wait { background:#fdcb6e; animation: blink 1s infinite; }
    @keyframes blink { 50%{opacity:0.3} }
  </style>
</head>
<body>
  <!-- 竖屏提示 -->
  <div class="rotate-device-overlay">
    <div class="rotate-icon">📱</div>
    <div class="rotate-text">请旋转设备至横屏体验游戏</div>
  </div>

  <!-- 重回房间提示 -->
  <div id="rejoin-banner" class="hidden" style="background:linear-gradient(135deg,#e94560,#c23152);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 12px 12px;position:fixed;top:0;left:0;right:0;z-index:100;">
    <span style="font-weight:bold;">🎮 你已在游戏中</span>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-sm" style="background:#fff;color:#e94560;" id="btn-rejoin">重回房间</button>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;" id="btn-exit-room">退出房间</button>
    </div>
  </div>

  <!-- 大厅 -->
  <div class="lobby-container" style="padding-top:55px;">
    <div class="lobby-header">
      <div class="flex items-center gap-10">
        <div class="avatar" id="user-avatar">?</div>
        <div>
          <div style="font-weight:bold;" id="user-name">玩家</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.5);">🪙 <span id="user-gold">0</span></div>
        </div>
      </div>
      <div class="flex items-center gap-10">
        <span style="font-size:12px;color:rgba(255,255,255,0.5);">
          <span class="ws-dot wait" id="ws-dot"></span>
          <span id="ws-text">连接中</span>
          &nbsp;|&nbsp; 在线: <span id="online-count">0</span>
        </span>
        <a href="profile.html" class="btn btn-sm btn-secondary">个人信息</a>
        <button class="btn btn-sm btn-danger" id="btn-logout">退出</button>
      </div>
    </div>

    <div class="lobby-content">
      <div class="lobby-main">
        <div class="lobby-actions">
          <button class="btn btn-primary btn-lg" id="btn-match">⚡ 快速匹配</button>
          <button class="btn btn-secondary btn-lg" id="btn-create">🏠 创建房间</button>
          <button class="btn btn-success btn-lg" id="btn-join">🚪 加入房间</button>
        </div>
        <div class="card-box" style="flex:1;overflow:hidden;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3>房间列表</h3>
            <button class="btn btn-sm btn-secondary" id="btn-refresh">刷新</button>
          </div>
          <div class="room-list" id="room-list">
            <div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px;">暂无房间</div>
          </div>
        </div>
      </div>
      <div class="lobby-sidebar">
        <div class="card-box">
          <h4 style="margin-bottom:10px;">匹配状态</h4>
          <div id="match-info" style="color:rgba(255,255,255,0.5);font-size:13px;">未在匹配中</div>
          <button class="btn btn-sm btn-danger hidden" id="btn-cancel" style="margin-top:10px;width:100%;">取消匹配</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 创建房间弹窗 -->
  <div class="modal-overlay" id="modal-create">
    <div class="modal">
      <div class="modal-title">创建房间</div>
      <div class="auth-form">
        <input type="password" class="input" id="inp-pwd" placeholder="房间密码 (可选)">
        <select class="input" id="inp-score">
          <option value="100">底分: 100</option>
          <option value="200">底分: 200</option>
          <option value="500">底分: 500</option>
        </select>
        <div class="flex gap-10">
          <button class="btn btn-primary" style="flex:1;" id="btn-do-create">创建</button>
          <button class="btn btn-secondary" style="flex:1;" id="btn-no-create">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 加入房间弹窗 -->
  <div class="modal-overlay" id="modal-join">
    <div class="modal">
      <div class="modal-title">加入房间</div>
      <div class="auth-form">
        <input type="text" class="input" id="inp-code" placeholder="房间号" maxlength="6">
        <input type="password" class="input" id="inp-jpwd" placeholder="密码 (如有)">
        <div class="flex gap-10">
          <button class="btn btn-primary" style="flex:1;" id="btn-do-join">加入</button>
          <button class="btn btn-secondary" style="flex:1;" id="btn-no-join">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ws.js"></script>
  <script>
    (function() {
      'use strict';

      // ===== 1. 检查登录 =====
      var token = Utils.storage.get('token');
      var user = Utils.storage.get('user');
      if (!token) {
        location.href = 'login.html';
        return;
      }

      // ===== 2. 立即显示用户信息 =====
      var displayName = (user && (user.nickname || user.username)) || '玩家';
      document.getElementById('user-name').textContent = displayName;
      document.getElementById('user-gold').textContent = (user && user.gold) || 0;
      document.getElementById('user-avatar').textContent = Utils.getAvatarLetter(displayName);

      // ===== 3. 连接状态 =====
      var wsDot = document.getElementById('ws-dot');
      var wsText = document.getElementById('ws-text');
      function setWs(s) {
        wsDot.className = 'ws-dot ' + s;
        wsText.textContent = s === 'on' ? '已连接' : s === 'off' ? '已断开' : '连接中';
      }

      // ===== 4. 先注册事件，再连接 =====
      var matched = false;

      WS.on('connected', function() {
        console.log('[Lobby] WS已连接');
        setWs('on');
      });

      WS.on('disconnected', function() {
        console.log('[Lobby] WS已断开');
        setWs('off');
      });

      WS.on('auth_result', function(data) {
        console.log('[Lobby] 认证:', data);
        if (data.success && data.user) {
          document.getElementById('user-gold').textContent = data.user.gold;
          Utils.storage.set('user', data.user);

          // 检测是否已在房间/游戏中
          if (data.gameState && data.gameState.state) {
            var banner = document.getElementById('rejoin-banner');
            banner.classList.remove('hidden');

            // 根据游戏状态决定跳转页面
            var targetPage = (data.gameState.state === 'playing' || data.gameState.state === 'bidding') ? 'game.html' : 'room.html';
            var btnText = (targetPage === 'game.html') ? '回到对局' : '重回房间';
            document.getElementById('btn-rejoin').textContent = btnText;
            document.getElementById('btn-rejoin').onclick = function() { location.href = targetPage; };
            document.getElementById('btn-exit-room').onclick = function() {
              // 退出房间：连接后发送离开请求
              WS.on('room_left', function() { location.reload(); });
              WS.on('error', function(d) { Utils.toast(d.msg, 'error'); });
              WS.leaveRoom();
            };

            // 禁用匹配/创建/加入按钮
            document.getElementById('btn-match').disabled = true;
            document.getElementById('btn-match').textContent = '已在房间中';
            document.getElementById('btn-create').disabled = true;
            document.getElementById('btn-join').disabled = true;
          }
        }
      });

      WS.on('online_count', function(data) {
        document.getElementById('online-count').textContent = data.count;
      });

      WS.on('match_success', function(data) {
        console.log('[Lobby] 匹配成功', data);
        matched = true;
        Utils.toast('匹配成功！', 'success');
        setTimeout(function() {
          location.href = 'room.html?roomId=' + data.roomId + '&roomCode=' + data.roomCode;
        }, 500);
      });

      WS.on('room_created', function(data) {
        console.log('[Lobby] 房间已创建', data);
        setTimeout(function() {
          location.href = 'room.html?roomId=' + data.roomId + '&roomCode=' + data.roomCode;
        }, 300);
      });

      WS.on('room_joined', function(data) {
        console.log('[Lobby] 已加入房间', data);
        setTimeout(function() {
          location.href = 'room.html?roomId=' + data.roomId + '&roomCode=' + data.roomCode;
        }, 300);
      });

      WS.on('error', function(data) {
        console.error('[Lobby] 错误:', data.msg);
        Utils.toast(data.msg, 'error');
      });

      // 连接
      setWs('wait');
      WS.connect();

      // ===== 5. 按钮事件 =====
      var isMatching = false;

      document.getElementById('btn-match').onclick = function() {
        if (!WS.isConnected) { Utils.toast('服务器连接中，请稍候', 'warning'); return; }
        if (isMatching) {
          WS.leaveMatch();
          isMatching = false;
          document.getElementById('match-info').textContent = '未在匹配中';
          document.getElementById('btn-cancel').classList.add('hidden');
          document.getElementById('btn-match').textContent = '⚡ 快速匹配';
        } else {
          WS.joinMatch();
          isMatching = true;
          document.getElementById('match-info').textContent = '匹配中... 请等待其他玩家';
          document.getElementById('btn-cancel').classList.remove('hidden');
          document.getElementById('btn-match').textContent = '匹配中...';
        }
      };

      document.getElementById('btn-cancel').onclick = function() {
        WS.leaveMatch();
        isMatching = false;
        document.getElementById('match-info').textContent = '未在匹配中';
        document.getElementById('btn-cancel').classList.add('hidden');
        document.getElementById('btn-match').textContent = '⚡ 快速匹配';
      };

      document.getElementById('btn-create').onclick = function() {
        if (!WS.isConnected) { Utils.toast('服务器连接中，请稍候', 'warning'); return; }
        document.getElementById('modal-create').classList.add('active');
      };
      document.getElementById('btn-no-create').onclick = function() {
        document.getElementById('modal-create').classList.remove('active');
      };
      document.getElementById('btn-do-create').onclick = function() {
        WS.createRoom(document.getElementById('inp-pwd').value, parseInt(document.getElementById('inp-score').value));
        document.getElementById('modal-create').classList.remove('active');
      };

      document.getElementById('btn-join').onclick = function() {
        if (!WS.isConnected) { Utils.toast('服务器连接中，请稍候', 'warning'); return; }
        document.getElementById('modal-join').classList.add('active');
      };
      document.getElementById('btn-no-join').onclick = function() {
        document.getElementById('modal-join').classList.remove('active');
      };
      document.getElementById('btn-do-join').onclick = function() {
        var code = document.getElementById('inp-code').value.trim();
        if (!code) { Utils.toast('请输入房间号', 'warning'); return; }
        WS.joinRoom(code, document.getElementById('inp-jpwd').value);
        document.getElementById('modal-join').classList.remove('active');
      };

      document.getElementById('btn-refresh').onclick = loadRooms;
      document.getElementById('btn-logout').onclick = function() {
        WS.disconnect();
        Utils.storage.remove('token');
        location.href = 'login.html';
      };

      // ===== 6. 房间列表 =====
      async function loadRooms() {
        var result = await API.getRoomList();
        var el = document.getElementById('room-list');
        if (result.code === 0 && result.data.length > 0) {
          el.innerHTML = result.data.map(function(r) {
            return '<div class="room-item">' +
              '<div><div style="font-weight:bold">房间 ' + r.roomCode + '</div>' +
              '<div style="font-size:12px;color:rgba(255,255,255,0.5)">底分:' + r.baseScore + (r.hasPassword ? ' 🔒' : '') + '</div></div>' +
              '<div style="text-align:right"><div>' + r.currentPlayers + '/3 人</div>' +
              '<button class="btn btn-sm btn-primary" onclick="WS.joinRoom(\'' + r.roomCode + '\')">加入</button></div></div>';
          }).join('');
        } else {
          el.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px">暂无房间，快创建一个吧！</div>';
        }
      }

      loadRooms();
      setInterval(loadRooms, 10000);

    })();
  </script>
</body>
</html>
