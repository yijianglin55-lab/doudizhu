<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>对局 - 斗地主</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="rotate-device-overlay">
    <div class="rotate-icon">📱</div>
    <div class="rotate-text">请旋转设备至横屏体验游戏</div>
  </div>

  <canvas id="fx-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:900;"></canvas>

  <div class="game-container">
    <div class="game-table">

      <!-- 顶部信息栏 -->
      <div class="top-bar">
        <div class="info-chip">底分: <span id="info-base">100</span></div>
        <div></div>
        <div class="info-chip">倍数: <span id="info-mult">1</span></div>
      </div>

      <!-- 倍数 -->
      <div class="multiplier-badge" id="mult-badge">×1</div>

      <!-- 出牌倒计时（跟随当前玩家） -->
      <div id="turn-timer" class="hidden" style="position:absolute;z-index:60;background:rgba(0,0,0,0.7);color:#fdcb6e;font-size:22px;font-weight:bold;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fdcb6e;">
        <span id="turn-timer-num">20</span>
      </div>

      <!-- 左侧对手 -->
      <div class="opponent-zone left">
        <div class="player-info" id="info-left">
          <div class="avatar" style="width:36px;height:36px;font-size:15px;" id="av-left">?</div>
          <div>
            <div class="pname" id="name-left">对手</div>
            <div class="pcount" id="cnt-left">17张</div>
          </div>
        </div>
        <div id="hand-left"></div>
      </div>

      <!-- 右侧对手 -->
      <div class="opponent-zone right">
        <div class="player-info" id="info-right">
          <div class="avatar" style="width:36px;height:36px;font-size:15px;" id="av-right">?</div>
          <div>
            <div class="pname" id="name-right">对手</div>
            <div class="pcount" id="cnt-right">17张</div>
          </div>
        </div>
        <div id="hand-right"></div>
      </div>

      <!-- 出牌区域 -->
      <div class="played-zone left-played" id="played-left"></div>
      <div class="played-zone right-played" id="played-right"></div>
      <div class="played-zone mine" id="played-mine"></div>

      <!-- 叫分面板 -->
      <div class="bid-panel hidden" id="bid-panel">
        <div style="text-align:center;margin-bottom:6px;">
          <div style="font-size:12px;color:rgba(255,255,255,0.5);">请叫分</div>
          <div style="font-size:20px;font-weight:bold;color:#fdcb6e;" id="bid-timer">15</div>
        </div>
        <button class="btn btn-secondary" onclick="Game.doBid(0)">不叫</button>
        <button class="btn btn-primary" onclick="Game.doBid(1)">1分</button>
        <button class="btn btn-primary" onclick="Game.doBid(2)">2分</button>
        <button class="btn btn-primary" onclick="Game.doBid(3)">3分</button>
      </div>

      <!-- 出牌按钮 -->
      <div class="action-bar hidden" id="action-bar">
        <button class="btn btn-primary" id="btn-play">出牌</button>
        <button class="btn btn-secondary" id="btn-pass">不出</button>
        <button class="btn btn-warning" id="btn-hint">提示</button>
      </div>

      <!-- 底牌（手牌正上方，横向） -->
      <div class="landlord-cards" id="landlord-cards"></div>

      <!-- 我的手牌 -->
      <div class="hand-area" id="hand-area"></div>

      <!-- 我的信息 -->
      <div class="my-info-box">
        <div class="player-info" id="info-me">
          <div class="avatar" style="width:36px;height:36px;font-size:15px;" id="av-me">?</div>
          <div>
            <div class="pname" id="name-me">我</div>
            <div class="pcount" id="cnt-me">17张</div>
          </div>
        </div>
      </div>

      <!-- 聊天 -->
      <div class="chat-box">
        <div class="chat-messages" id="chat-msgs"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="消息..." maxlength="50">
          <button class="btn btn-sm btn-primary" id="btn-chat">发送</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 结算弹窗 -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal result-modal">
      <div class="result-title" id="result-title">胜利！</div>
      <div class="result-detail" id="result-detail"></div>
      <div class="result-scores" id="result-scores"></div>
      <button class="btn btn-primary btn-lg" onclick="location.href='lobby.html'">返回大厅</button>
    </div>
  </div>

  <!-- 加载 -->
  <div id="loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:2000;">
    <div style="text-align:center;">
      <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
      <div style="margin-top:15px;color:rgba(255,255,255,0.6);">正在连接游戏...</div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ws.js"></script>
  <script src="js/cards.js"></script>
  <script src="canvas/effects.js"></script>
  <script>
    var Game = {
      myIndex: -1,
      myCards: [],
      players: [],
      landlordIndex: -1,
      currentPlayer: -1,
      multiplier: 1,
      baseScore: 100,
      isPlaying: false,
      isBidding: false,
      relKeys: ['me', 'left', 'right'],

      init: function() {
        var self = this;
        var myUser = Utils.storage.get('user');
        if (myUser) {
          document.getElementById('av-me').textContent = Utils.getAvatarLetter(myUser.nickname || myUser.username);
          document.getElementById('name-me').textContent = myUser.nickname || myUser.username;
        }
        Effects.init('fx-canvas');

        document.getElementById('btn-play').onclick = function() { self.onPlay(); };
        document.getElementById('btn-pass').onclick = function() { self.onPass(); };
        document.getElementById('btn-hint').onclick = function() { self.onHint(); };
        document.getElementById('btn-chat').onclick = function() { self.onChat(); };
        document.getElementById('chat-input').onkeypress = function(e) { if(e.key==='Enter') self.onChat(); };

        // ===== 事件 =====
        WS.on('auth_result', function(data) {
          document.getElementById('loading').style.display = 'none';
          if (!data.success) { location.href = 'login.html'; return; }
          if (data.gameState) self.restoreFromState(data.gameState);
        });

        WS.on('game_started', function(data) {
          document.getElementById('loading').style.display = 'none';
          if (data.gameState) self.restoreFromState(data.gameState);
        });

        WS.on('bidding_start', function(data) {
          self.isBidding = true;
          self.showBidPanel(data.firstBidder);
        });

        WS.on('bid_result', function(data) {
          if (data.action === 'landlord_settled') {
            self.landlordIndex = data.landlordIndex;
            self.multiplier = data.multiplier;
            document.getElementById('bid-panel').classList.add('hidden');
            if (data.landlordCards) Cards.renderLandlordCards(data.landlordCards, document.getElementById('landlord-cards'), true);
            self.updateMultiplier();
          } else if (data.action === 'next_bid') {
            self.showBidPanel(data.nextBidder);
          }
        });

        WS.on('play_start', function(data) {
          console.log('[Game] play_start, 地主:', data.landlordIndex);
          self.isBidding = false;
          self.isPlaying = true;
          self.landlordIndex = data.landlordIndex;
          self.multiplier = data.multiplier;
          self.currentPlayer = data.firstPlayer;
          document.getElementById('bid-panel').classList.add('hidden');
          if (data.landlordCards) Cards.renderLandlordCards(data.landlordCards, document.getElementById('landlord-cards'), true);
          // 关键：用gameState更新手牌（地主有20张）
          if (data.gameState) {
            self.myIndex = data.gameState.myIndex;
            self.players = data.gameState.players || [];
            if (data.gameState.myCards) self.myCards = data.gameState.myCards;
          }
          self.renderPlayers();
          self.renderMyHand();
          self.updatePlayerUI();
          self.updateMultiplier();
        });

        WS.on('card_played', function(data) { self.onCardPlayed(data); });
        WS.on('player_pass', function(data) { self.onPlayerPass(data); });

        WS.on('hint_result', function(data) {
          if (data.cards && data.cards.length > 0) {
            Cards.highlightCards(data.cards.map(function(c){return c.id;}), document.getElementById('hand-area'));
          } else { Utils.toast('没有能压过的牌', 'warning'); }
        });

        WS.on('chat_message', function(data) { self.addChat(data.nickname, data.message); });

        WS.on('game_over', function(data) {
          self.isPlaying = false; self.isBidding = false;
          setTimeout(function() { self.showResult(data); }, 1000);
        });

        WS.on('error', function(data) { Utils.toast(data.msg, 'error'); });

        WS.connect();
      },

      // ===== 恢复状态（关键：始终更新myCards） =====
      restoreFromState: function(gs) {
        this.myIndex = gs.myIndex;
        this.players = gs.players || [];
        this.landlordIndex = gs.landlordIndex;
        this.currentPlayer = gs.currentPlayerIndex;
        this.multiplier = gs.multiplier;
        this.baseScore = gs.baseScore;

        // 始终用服务器返回的手牌更新本地（叫分后地主会有20张）
        if (gs.myCards) this.myCards = gs.myCards;

        this.renderPlayers();
        this.renderMyHand();
        this.updateMultiplier();

        document.getElementById('bid-panel').classList.add('hidden');
        document.getElementById('action-bar').classList.add('hidden');

        if (gs.state === 'dealing' || gs.state === 'bidding') {
          this.isBidding = true; this.isPlaying = false;
          if (gs.bidding) this.showBidPanel(gs.bidding.currentBidder);
        } else if (gs.state === 'playing') {
          this.isBidding = false; this.isPlaying = true;
          if (gs.landlordCards && gs.landlordCards.length > 0)
            Cards.renderLandlordCards(gs.landlordCards, document.getElementById('landlord-cards'), true);
          if (gs.lastPlayCards && gs.lastPlayCards.length > 0)
            this.showPlayedCards(gs.lastPlayPlayerIndex, gs.lastPlayCards);
          this.updatePlayerUI();
        }
      },

      bidTimer: null,
      bidTimeLeft: 15,

      showBidPanel: function(bidder) {
        var isMyTurn = bidder === this.myIndex;
        document.getElementById('bid-panel').classList.toggle('hidden', !isMyTurn);
        if (isMyTurn) {
          document.getElementById('action-bar').classList.add('hidden');
          this.startBidCountdown();
        } else {
          this.stopBidCountdown();
        }
      },

      startBidCountdown: function() {
        var self = this;
        this.stopBidCountdown();
        this.bidTimeLeft = 15;
        document.getElementById('bid-timer').textContent = this.bidTimeLeft;
        this.bidTimer = setInterval(function() {
          self.bidTimeLeft--;
          document.getElementById('bid-timer').textContent = self.bidTimeLeft;
          if (self.bidTimeLeft <= 0) {
            self.stopBidCountdown();
          }
        }, 1000);
      },

      stopBidCountdown: function() {
        if (this.bidTimer) { clearInterval(this.bidTimer); this.bidTimer = null; }
      },

      playTimer: null,
      playTimeLeft: 20,

      // 定位倒计时到当前玩家旁边
      positionTimer: function() {
        var timerEl = document.getElementById('turn-timer');
        if (!timerEl) return;
        if (this.currentPlayer < 0 || !this.isPlaying) {
          timerEl.classList.add('hidden');
          return;
        }
        var key = this.relKeys[this.getRel(this.currentPlayer)];
        var infoEl = document.getElementById('info-' + key);
        if (!infoEl) { timerEl.classList.add('hidden'); return; }

        var rect = infoEl.getBoundingClientRect();
        // 放在玩家信息右侧
        timerEl.style.left = (rect.right + 8) + 'px';
        timerEl.style.top = (rect.top + rect.height / 2 - 22) + 'px';
        timerEl.classList.remove('hidden');
      },

      startPlayCountdown: function() {
        var self = this;
        this.stopPlayCountdown();
        this.playTimeLeft = 20;
        var numEl = document.getElementById('turn-timer-num');
        if (numEl) numEl.textContent = this.playTimeLeft;
        this.positionTimer();
        this.playTimer = setInterval(function() {
          self.playTimeLeft--;
          if (numEl) numEl.textContent = self.playTimeLeft;
          // 最后5秒变红
          var timerEl = document.getElementById('turn-timer');
          if (timerEl) {
            timerEl.style.borderColor = self.playTimeLeft <= 5 ? '#e94560' : '#fdcb6e';
            timerEl.style.color = self.playTimeLeft <= 5 ? '#e94560' : '#fdcb6e';
          }
          if (self.playTimeLeft <= 0) self.stopPlayCountdown();
        }, 1000);
      },

      stopPlayCountdown: function() {
        if (this.playTimer) { clearInterval(this.playTimer); this.playTimer = null; }
        var timerEl = document.getElementById('turn-timer');
        if (timerEl) timerEl.classList.add('hidden');
      },

      renderPlayers: function() {
        var self = this;
        this.players.forEach(function(p, i) {
          if (!p) return;
          var key = self.relKeys[self.getRel(i)];
          if (key === 'me') {
            document.getElementById('cnt-me').textContent = p.handCount + '张';
            return;
          }
          document.getElementById('name-' + key).textContent = p.nickname || '对手';
          document.getElementById('cnt-' + key).textContent = p.handCount + '张';
          document.getElementById('av-' + key).textContent = Utils.getAvatarLetter(p.nickname);
          Cards.renderOpponentHand(p.handCount, document.getElementById('hand-' + key));
        });
      },

      renderMyHand: function() {
        Cards.renderHand(this.myCards, document.getElementById('hand-area'), true);
      },

      updatePlayerUI: function() {
        var self = this;
        this.players.forEach(function(_, i) {
          var key = self.relKeys[self.getRel(i)];
          var info = document.getElementById('info-' + key);
          if (info) info.classList.toggle('active', i === self.currentPlayer);
        });
        var isMyTurn = this.currentPlayer === this.myIndex;
        var showActions = isMyTurn && this.isPlaying && !this.isBidding;
        document.getElementById('action-bar').classList.toggle('hidden', !showActions);

        // 出牌阶段：所有人都显示倒计时
        if (this.isPlaying && this.currentPlayer >= 0) {
          this.startPlayCountdown();
        } else {
          this.stopPlayCountdown();
        }
      },

      updateMultiplier: function() {
        document.getElementById('info-mult').textContent = this.multiplier;
        document.getElementById('mult-badge').textContent = '×' + this.multiplier;
      },

      getRel: function(absIdx) { return (absIdx - this.myIndex + 3) % 3; },

      showPlayedCards: function(playerIndex, cards) {
        var zoneMap = ['played-mine', 'played-left', 'played-right'];
        var el = document.getElementById(zoneMap[this.getRel(playerIndex)]);
        if (el) { el.innerHTML = ''; Cards.renderPlayedCards(cards, el); }
      },

      clearPlayedCards: function(exceptIndex) {
        var self = this;
        var zoneMap = ['played-mine', 'played-left', 'played-right'];
        this.players.forEach(function(_, i) {
          if (i === exceptIndex) return;
          var el = document.getElementById(zoneMap[self.getRel(i)]);
          if (el) el.innerHTML = '';
        });
      },

      doBid: function(score) { WS.bid(score); },
      onPlay: function() {
        var ids = Cards.getSelectedCardIds(document.getElementById('hand-area'));
        if (ids.length === 0) { Utils.toast('请先选牌', 'warning'); return; }
        WS.playCards(ids);
      },
      onPass: function() { WS.pass(); },
      onHint: function() { WS.hint(); },
      onChat: function() {
        var input = document.getElementById('chat-input');
        var msg = input.value.trim();
        if (!msg) return;
        WS.chat(msg);
        input.value = '';
      },

      onCardPlayed: function(data) {
        this.showPlayedCards(data.playerIndex, data.cards);
        if (data.playerIndex === this.myIndex) {
          var ids = data.cards.map(function(c){return c.id;});
          this.myCards = this.myCards.filter(function(c){return ids.indexOf(c.id)===-1;});
          this.renderMyHand();
        }
        // 实时更新该玩家的手牌数
        if (this.players[data.playerIndex]) {
          this.players[data.playerIndex].handCount = data.remainingCards;
        }
        this.renderPlayers();

        this.multiplier = data.multiplier;
        this.updateMultiplier();
        this.currentPlayer = data.nextPlayer;
        this.updatePlayerUI();

        if (data.cardType === 'bomb') Effects.bombEffect(innerWidth/2, innerHeight/2);
        else if (data.cardType === 'rocket') Effects.rocketEffect(innerWidth/2, innerHeight/2);

        var self = this;
        setTimeout(function() { self.clearPlayedCards(data.playerIndex); }, 1500);
      },

      onPlayerPass: function(data) {
        var zoneMap = ['played-mine', 'played-left', 'played-right'];
        var el = document.getElementById(zoneMap[this.getRel(data.playerIndex)]);
        if (el) el.innerHTML = '<div class="pass-label">不出</div>';
        this.currentPlayer = data.nextPlayer;
        this.updatePlayerUI();
      },

      showResult: function(data) {
        var isWin = data.scores && data.scores[this.myIndex] > 0;
        var title = document.getElementById('result-title');
        title.textContent = isWin ? '🎉 胜利！' : '😢 失败';
        title.className = 'result-title ' + (isWin ? 'win' : 'lose');
        document.getElementById('result-detail').textContent =
          '底分:' + this.baseScore + ' × ' + data.multiplier + (data.isSpring ? ' (春天×2)' : '');
        if (data.settlement) {
          document.getElementById('result-scores').innerHTML = data.settlement.players.map(function(p) {
            return '<div class="result-player"><div class="result-player-name">' + p.nickname + '</div>' +
              '<div class="result-player-score ' + (p.score>0?'positive':'negative') + '">' +
              (p.score>0?'+':'') + p.score + '</div></div>';
          }).join('');
        }
        document.getElementById('result-modal').classList.add('active');
        if (isWin) Effects.coinDrop(innerWidth/2, innerHeight/3, 15);
      },

      addChat: function(name, msg) {
        var el = document.getElementById('chat-msgs');
        var div = document.createElement('div');
        div.className = 'chat-message chat-bubble';
        div.innerHTML = '<strong>' + name + ':</strong> ' + msg;
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;
      }
    };

    Game.init();
  </script>
</body>
</html>
