<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 斗地主</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="rotate-device-overlay">
    <div class="rotate-icon">📱</div>
    <div class="rotate-text">请旋转设备至横屏体验游戏</div>
  </div>

  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-title">🃏 斗地主</div>

      <form class="auth-form" id="login-form">
        <input type="text" class="input" id="username" placeholder="用户名" autocomplete="username">
        <input type="password" class="input" id="password" placeholder="密码" autocomplete="current-password">
        <button type="submit" class="btn btn-primary">登 录</button>
      </form>

      <div style="text-align:center;margin:14px 0;color:rgba(255,255,255,0.25);font-size:12px;">── 或 ──</div>

      <button type="button" class="btn btn-success" style="width:100%;" id="btn-guest">🎮 游客进入</button>

      <div style="text-align:center;margin-top:8px;font-size:11px;color:rgba(255,255,255,0.35);">
        游客 1000 金币 · 注册送 10000 金币
      </div>

      <div class="auth-footer">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function() {
      // 已有普通登录态
      var token = Utils.storage.get('token');
      if (token) {
        location.href = 'lobby.html';
        return;
      }

      // 普通登录
      document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        if (!username || !password) { Utils.toast('请填写用户名和密码', 'warning'); return; }

        var btn = e.target.querySelector('button');
        btn.disabled = true; btn.textContent = '登录中...';
        var result = await API.login(username, password);
        if (result.code === 0) {
          Utils.storage.set('token', result.data.token);
          Utils.storage.set('user', result.data.user);
          Utils.toast('登录成功', 'success');
          setTimeout(function() { location.href = 'lobby.html'; }, 400);
        } else {
          Utils.toast(result.msg, 'error');
          btn.disabled = false; btn.textContent = '登 录';
        }
      });

      // 游客进入
      document.getElementById('btn-guest').addEventListener('click', function() {
        var guestToken = Utils.storage.get('guest_token');
        if (guestToken) {
          // 已有游客账号 → 直接登录
          Utils.storage.set('token', guestToken);
          location.href = 'lobby.html';
        } else {
          // 没有游客账号 → 去昵称页
          location.href = 'guest.html';
        }
      });

    })();
  </script>
</body>
</html>
