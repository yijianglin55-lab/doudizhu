<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 斗地主</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="rotate-device-overlay">
    <div class="rotate-icon">📱</div>
    <div class="rotate-text">请旋转设备至横屏体验游戏</div>
  </div>

  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-title">🃏 用户登录</div>
      <form class="auth-form" id="login-form">
        <input type="text" class="input" id="username" placeholder="请输入用户名" autocomplete="username" required>
        <input type="password" class="input" id="password" placeholder="请输入密码" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary btn-ripple">登 录</button>
      </form>

      <div style="text-align:center;margin:16px 0;color:rgba(255,255,255,0.3);font-size:13px;">── 或 ──</div>

      <div class="auth-form" id="guest-form">
        <input type="text" class="input" id="guest-nickname" placeholder="输入昵称，游客快速进入" maxlength="20">
        <button type="button" class="btn btn-success btn-ripple" id="btn-guest">🎮 游客进入</button>
      </div>

      <div style="text-align:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,0.4);">
        游客仅获赠 1000 金币 · 注册账号可获赠 10000 金币
      </div>

      <div class="auth-footer">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (Utils.storage.get('token')) { location.href = 'lobby.html'; }
    Utils.checkOrientation();

    // 登录
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { Utils.toast('请填写用户名和密码', 'warning'); return; }

      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = '登录中...';
      const result = await API.login(username, password);
      if (result.code === 0) {
        Utils.storage.set('token', result.data.token);
        Utils.storage.set('user', result.data.user);
        Utils.toast('登录成功', 'success');
        setTimeout(() => { location.href = 'lobby.html'; }, 500);
      } else {
        Utils.toast(result.msg, 'error');
        btn.disabled = false; btn.textContent = '登 录';
      }
    });

    // 游客登录
    document.getElementById('btn-guest').addEventListener('click', async () => {
      const nickname = document.getElementById('guest-nickname').value.trim();
      if (!nickname) { Utils.toast('请输入昵称', 'warning'); return; }

      const btn = document.getElementById('btn-guest');
      btn.disabled = true; btn.textContent = '进入中...';
      const result = await API.request('/api/auth/guest', {
        method: 'POST',
        body: JSON.stringify({ nickname }),
      });
      if (result.code === 0) {
        Utils.storage.set('token', result.data.token);
        Utils.storage.set('user', result.data.user);
        Utils.toast('游客登录成功', 'success');
        setTimeout(() => { location.href = 'lobby.html'; }, 500);
      } else {
        Utils.toast(result.msg, 'error');
        btn.disabled = false; btn.textContent = '🎮 游客进入';
      }
    });
  </script>
</body>
</html>
