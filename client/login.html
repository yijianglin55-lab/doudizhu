<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 斗地主</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- 竖屏提示 -->
    <div class="rotate-text">请旋转设备至横屏体验游戏</div>
  </div>

  <!-- 登录页 -->
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-title">🃏 用户登录</div>
      <form class="auth-form" id="login-form">
        <input type="text" class="input" id="username" placeholder="请输入用户名" autocomplete="username" required>
        <input type="password" class="input" id="password" placeholder="请输入密码" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary btn-ripple">登 录</button>
      </form>
      <div class="auth-footer">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script>
    // 检查是否已登录
    if (Utils.storage.get('token')) {
      window.location.href = 'lobby.html';
    }

    // 检查屏幕方向

    // 登录表单提交
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        Utils.toast('请填写用户名和密码', 'warning');
        return;
      }

      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = '登录中...';

      const result = await API.login(username, password);

      if (result.code === 0) {
        Utils.storage.set('token', result.data.token);
        Utils.storage.set('user', result.data.user);
        Utils.toast('登录成功', 'success');
        setTimeout(() => {
          window.location.href = 'lobby.html';
        }, 500);
      } else {
        Utils.toast(result.msg, 'error');
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
