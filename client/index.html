<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>斗地主 - 在线联机</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .splash-title {
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(135deg, #e94560, #fdcb6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
    }
    .splash-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
    }
    .splash-actions {
      display: flex;
      gap: 20px;
    }
    .splash-cards {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .online-info {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <!-- 竖屏提示 -->
    <div class="rotate-text">请旋转设备至横屏体验游戏</div>
  </div>

  <!-- 启动页 -->
  <div class="splash-container">
    <div class="splash-cards">🃏🂡🂱</div>
    <div class="splash-title">斗地主</div>
    <div class="splash-subtitle">在线联机 · 实时对战</div>
    <div class="splash-actions">
      <a href="login.html" class="btn btn-primary btn-lg">登录</a>
      <a href="register.html" class="btn btn-secondary btn-lg">注册</a>
    </div>
    <div class="online-info">当前在线: <span id="online-count">0</span> 人</div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    // 检查是否已登录
    const token = Utils.storage.get('token');
    if (token) {
      window.location.href = 'lobby.html';
    }

    // 检查屏幕方向
  </script>
</body>
</html>
